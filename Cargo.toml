[package]
name = "motivate"
version = "0.3.0"
edition = "2021"
repository="https://github.com/dxphilo/motivate"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48"
rand = "0.8"
include_dir = "0.7.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Global dist configuration (top-level [dist] table)
[dist]
# Build each package precisely/individually (recommended for single-crate projects)
precise = true

# Generate checksum files (use a string for the algorithm)
checksum = "sha256"

# Per-package dist configuration
[package.metadata.dist]
# Enable the universal installers
installers = ["shell", "powershell"]