[package]
name = "motivate"
version = "0.1.0"
edition = "2021"
repository="https://github.com/dxphilo/motivate"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48"
rand = "0.8"
include_dir = "0.7.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Add this new section to enable the universal installers
[package.metadata.dist]
# Enable the shell (Linux/macOS) and PowerShell (Windows) installers
installers = ["shell", "powershell"]

# Optional: Use static builds where possible (recommended for maximum compatibility)
precise = true

# Optional: Generate checksum files for extra security (users can verify downloads)
checksum = true

# Optional: Enable GitHub Releases features (already default, but explicit is fine)
github-releases = true